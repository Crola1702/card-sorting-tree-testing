name: Keep Supabase awake

# Free Supabase projects pause after low activity over 7 days; a few daily requests avoid it.
# GitHub disables scheduled workflows after 60 days without repository activity: see README "Operations".
on:
  schedule:
    - cron: '17 9 * * *' # daily, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run a real database query with the public key
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        # A failure here (paused project, wrong key) fails the run, and GitHub emails the repo owner.
        run: |
          curl --fail-with-body -sS --retry 3 --retry-all-errors --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{}'
